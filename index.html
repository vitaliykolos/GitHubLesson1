<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domain Russian Roots Checker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #e0e0e0;
        }

        header {
            text-align: center;
            padding: 40px 20px 20px;
            max-width: 700px;
        }

        header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #fff, #90caf9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            font-size: 1rem;
            color: #90a4ae;
        }

        .search-container {
            margin-top: 30px;
            width: 90%;
            max-width: 600px;
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        .search-box input {
            flex: 1;
            padding: 14px 20px;
            border: 2px solid #334155;
            border-radius: 10px;
            background: #1e293b;
            color: #e2e8f0;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-box input::placeholder {
            color: #64748b;
        }

        .search-box input:focus {
            border-color: #3b82f6;
        }

        .search-box button {
            padding: 14px 28px;
            border: none;
            border-radius: 10px;
            background: #3b82f6;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            white-space: nowrap;
        }

        .search-box button:hover {
            background: #2563eb;
        }

        .result-card {
            margin-top: 30px;
            width: 90%;
            max-width: 600px;
            background: #1e293b;
            border-radius: 14px;
            padding: 30px;
            display: none;
            border: 1px solid #334155;
        }

        .result-card.visible {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
        }

        .result-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
        }

        .result-icon.russian {
            background: rgba(239, 68, 68, 0.15);
        }

        .result-icon.not-russian {
            background: rgba(34, 197, 94, 0.15);
        }

        .result-icon.uncertain {
            background: rgba(234, 179, 8, 0.15);
        }

        .result-title {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .result-title.russian { color: #f87171; }
        .result-title.not-russian { color: #4ade80; }
        .result-title.uncertain { color: #facc15; }

        .result-domain {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-top: 2px;
        }

        .result-details {
            margin-top: 10px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #334155;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .detail-value {
            font-weight: 600;
            font-size: 0.9rem;
            text-align: right;
            max-width: 60%;
        }

        .explanation {
            margin-top: 18px;
            padding: 16px;
            background: #0f172a;
            border-radius: 10px;
            font-size: 0.9rem;
            line-height: 1.6;
            color: #cbd5e1;
        }

        .tag {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-right: 4px;
            margin-bottom: 4px;
        }

        .tag.match { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        .tag.tld { background: rgba(96, 165, 250, 0.2); color: #60a5fa; }
        .tag.safe { background: rgba(34, 197, 94, 0.2); color: #4ade80; }

        footer {
            margin-top: auto;
            padding: 30px;
            color: #475569;
            font-size: 0.85rem;
            text-align: center;
        }

        .examples {
            margin-top: 16px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .example-btn {
            padding: 6px 14px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .example-btn:hover {
            border-color: #3b82f6;
            color: #e2e8f0;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #64748b;
        }

        .loading::after {
            content: '';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }
    </style>
</head>
<body>

<header>
    <h1>Domain Russian Roots Checker</h1>
    <p>Enter a domain name to analyze whether the brand has Russian origins</p>
</header>

<div class="search-container">
    <div class="search-box">
        <input type="text" id="domainInput" placeholder="e.g. yandex.ru, kaspersky.com, vk.com" autofocus>
        <button id="checkBtn" onclick="checkDomain()">Check</button>
    </div>
    <div class="examples">
        <button class="example-btn" onclick="fillExample('yandex.ru')">yandex.ru</button>
        <button class="example-btn" onclick="fillExample('kaspersky.com')">kaspersky.com</button>
        <button class="example-btn" onclick="fillExample('google.com')">google.com</button>
        <button class="example-btn" onclick="fillExample('vk.com')">vk.com</button>
        <button class="example-btn" onclick="fillExample('telegram.org')">telegram.org</button>
        <button class="example-btn" onclick="fillExample('nginx.com')">nginx.com</button>
    </div>
</div>

<div class="result-card" id="resultCard"></div>

<footer>
    Domain Russian Roots Checker &mdash; Analyzes brand names for Russian origins based on known databases and linguistic patterns.
</footer>

<script src="checker.js"></script>
</body>
</html>
